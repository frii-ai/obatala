version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: obatala
    main: ./cmd/obatala
    binary: obatala
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: frii-ai
    name: obatala
  footer: See [CHANGELOG.md](https://github.com/frii-ai/obatala/blob/{{ .Tag }}/CHANGELOG.md).
